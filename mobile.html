<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>犭偏旁配字游戏</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f4ed;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;color:#222}.game{width:min(1080px,94vw);padding:30px}h1{text-align:center;font-size:40px;margin:0 0 10px}.hint{text-align:center;color:#666;font-size:18px;margin-bottom:28px}.cols{display:grid;grid-template-columns:1fr 2fr 1.35fr;gap:34px;align-items:center}.left,.right{display:flex;justify-content:center}.radical{width:180px;height:180px;background:#fff;border:3px solid #222;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:104px;box-shadow:0 6px 0 #00000012}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{height:110px;background:#d9d5ca;border:3px solid #222;border-radius:16px;font-size:58px;cursor:pointer;box-shadow:0 5px 0 #00000012;color:transparent;position:relative}.card:after{content:"？";color:#555;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700}.card:hover{transform:translateY(-2px)}.card.revealed{background:#fff;color:#222}.card.revealed:after{display:none}.card.sel{background:#fff3b7;outline:5px solid #e7c246}.answer-area{display:flex;align-items:flex-end;justify-content:center;gap:18px}.result-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}.picture{width:150px;height:150px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:100px;box-shadow:0 5px 0 #00000012;visibility:hidden;margin-bottom:40px}.pinyin{height:42px;font-size:30px;font-weight:600;letter-spacing:1px}.tian{position:relative;width:230px;height:230px;background:#fff;border:4px solid #b64c43;display:flex;align-items:center;justify-content:center}.tian:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed #b64c4388}.tian:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed #b64c4388}.result{position:relative;z-index:1;font-family:KaiTi,STKaiti,serif;font-size:142px}.formula{text-align:center;min-height:34px;font-size:23px;margin-top:22px}.controls{text-align:center;margin-top:28px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.shuffle{border:0;border-radius:999px;background:#222;color:#fff;padding:13px 26px;font-size:18px;cursor:pointer}.shuffle:disabled{opacity:.4;cursor:not-allowed}@media(max-width:760px){.cols{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.radical{width:130px;height:130px;font-size:78px}.tian{width:190px;height:190px}.result{font-size:116px}}
</style><style>html,body{width:100%;min-height:100%;overflow-x:hidden}body{align-items:flex-start}.game{width:100%;max-width:520px;padding:18px 14px 26px;margin:0 auto}h1{font-size:28px;margin:4px 0 8px}.hint{font-size:15px;line-height:1.45;margin:0 auto 16px;max-width:390px}.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:center}.left{order:1}.cards{order:2;width:100%;grid-template-columns:repeat(3,1fr);gap:10px}.right{order:3}.radical{width:94px;height:94px;font-size:60px;border-radius:16px;border-width:2px}.card{height:76px;font-size:42px;border-width:2px;border-radius:13px;box-shadow:0 3px 0 #00000012}.card:after{font-size:32px}.answer-area{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:12px}.result-wrap{gap:5px}.pinyin{height:30px;font-size:23px}.tian{width:145px;height:145px;border-width:3px}.result{font-size:92px}.picture{width:112px;height:112px;font-size:76px;border-radius:16px;margin-bottom:0;align-self:flex-end}.formula{font-size:19px;min-height:28px;margin-top:14px}.controls{margin-top:14px;gap:9px;display:grid;grid-template-columns:1fr 1fr}.shuffle{padding:11px 8px;font-size:15px;line-height:1.2;min-height:48px}@media(max-width:370px){.game{padding-left:10px;padding-right:10px}h1{font-size:25px}.card{height:68px;font-size:38px}.tian{width:132px;height:132px}.result{font-size:84px}.picture{width:100px;height:100px;font-size:68px}}@media(min-width:700px){body{justify-content:center}.game{max-width:560px}}</style></head><body><main class="game"><h1>犭偏旁配字游戏</h1><div class="hint">随机翻开中间一张卡片，看看它和“犭”可以组成什么字。<br><span style="font-size:16px">Flip over a card and see what character it can form with “犭”.</span></div><section class="cols"><div class="left"><div class="radical">犭</div></div><div class="cards" id="cards"></div><div class="right"><div class="answer-area"><div class="result-wrap"><div class="pinyin" id="pinyin">&nbsp;</div><div class="tian"><span class="result" id="result"></span></div></div><div class="picture" id="picture"></div></div></div></section><div class="formula" id="formula">请随机翻开一张卡片 / Flip over a card</div><div class="controls"><button class="shuffle" id="check" disabled>检查答案 / Check Answer</button> <button class="shuffle" id="shuffle">下一轮・打乱卡片 / Next Round</button></div></main>
<script>
const pairs=[["句","狗","gǒu","🐕"],["苗","猫","māo","🐈"],["良","狼","láng","🐺"],["侯","猴","hóu","🐒"],["星","猩","xīng","🦍"],["瓜","狐","hú","🦊"]],cards=document.getElementById("cards"),result=document.getElementById("result"),formula=document.getElementById("formula");
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let pending=null;
function round(){
  cards.innerHTML="";
  result.textContent="";
  document.getElementById("pinyin").innerHTML="&nbsp;";
  formula.textContent="请随机翻开一张卡片 / Flip over a card";
  pending=null;
  document.getElementById("check").disabled=true;
  mix(pairs).forEach(([p,w,py,pic])=>{
    let btn=document.createElement("button");
    btn.className="card";
    btn.textContent=p;
    btn.setAttribute("aria-label","未翻开的卡片");
    btn.onclick=()=>{
      if(btn.classList.contains("revealed"))return;
      document.querySelectorAll(".card").forEach(x=>{
        x.classList.remove("revealed","sel");
        x.setAttribute("aria-label","未翻开的卡片");
      });
      btn.classList.add("revealed","sel");
      btn.setAttribute("aria-label",p);
      pending={p,w,py,pic};
      result.textContent="";
      document.getElementById("pinyin").innerHTML="&nbsp;";
      document.getElementById("picture").textContent="";
      document.getElementById("picture").style.visibility="hidden";
      formula.textContent="犭 ＋ "+p+" → ？";
      document.getElementById("check").disabled=false;
    };
    cards.appendChild(btn);
  });
}
document.getElementById("check").onclick=()=>{
  if(!pending)return;
  result.textContent=pending.w;
  document.getElementById("pinyin").textContent=pending.py;
  document.getElementById("picture").textContent=pending.pic;
  document.getElementById("picture").style.visibility="visible";
  formula.textContent="犭 ＋ "+pending.p+" → "+pending.w;
  document.getElementById("check").disabled=true;
};
document.getElementById("shuffle").onclick=round;
round();
</script></body></html>
